<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웨딩체크 프로토타입</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="root"></div>

<!-- React 18 + Babel standalone (빌드 도구 없이 브라우저에서 바로 JSX 실행) -->
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- 시드 데이터 (순수 JS, JSX 없음) -->
<script src="js/data.js"></script>

<!-- 공용 헬퍼 + 화면 컴포넌트 — 의존 순서대로 로드 -->
<script type="text/babel" src="js/helpers.js"></script>
<script type="text/babel" src="js/screens/RunScreen.js"></script>
<script type="text/babel" src="js/screens/ScheduleScreen.js"></script>
<script type="text/babel" src="js/screens/TemplateScreen.js"></script>
<script type="text/babel" src="js/screens/WeddingScreen.js"></script>
<script type="text/babel" src="js/screens/WeddingDetailScreen.js"></script>
<script type="text/babel" src="js/screens/MemberScreen.js"></script>
<script type="text/babel" src="js/screens/InsightScreen.js"></script>
<script type="text/babel" src="js/screens/AdminScreen.js"></script>
<script type="text/babel" src="js/App.js"></script>
<script type="text/babel" src="js/main.js"></script>
</body>
</html>
