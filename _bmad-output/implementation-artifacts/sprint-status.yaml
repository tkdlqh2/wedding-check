  5-2-ceremony-calendar-pagination:
    stage: merged
    branch: story/5-2-ceremony-calendar-pagination
    pr_url: "https://github.com/tkdlqh2/wedding-check/pull/15"
    merge_commit: "249e5b5"
    notes: "git worktree(.claude/worktrees/story+5-2-ceremony-calendar-pagination)로 착수, main(03e3c84) 기준 분기, fast-forward merge 후 브랜치 삭제. 착수 중 대표 피드백으로 범위 확장 — 이 스토리가 만지는 화면(어드민 내비 셸 + 예식 화면)에 한해 prototype/(Claude Design 목업) 디자인 구조와 정렬(AC 5~7). 예식 목록 캘린더/페이지네이션(repo/service/컴포넌트/CSS) + 어드민 내비 활성 탭 스타일 구현. 코덱스 리뷰 4라운드(1~3차 전부 실결함 발견 후 수정, 4차 클린) — 이 저장소에서 두 번째로 리뷰 라운드가 많았던 스토리(2-3-operator-instance-view 다음). 코덱스 발견 8건, 전부 실결함: (1차 P1) admin-nav-links.tsx에 \"템플릿\"을 다시 추가해, 바로 이 스토리의 베이스 커밋(fix/admin-nav-remove-redundant-template-tab, 03e3c84)에서 이미 제거됐던 /admin/halls 중복 탭을 실수로 되돌림 — 제거. (1차 P2) listCeremoniesPaginated가 clamp된 실제 page를 반환하지 않아 ?page=999 같은 요청에서 페이지네이션 상태(\"999 / 2\")와 실제 표시 데이터가 어긋남 — 반환값에 clamp된 page 포함, 호출부가 이를 렌더링하도록 수정. (1차 P2) 캘린더 이전/다음 달 이동이 선택된 날짜를 유지해 다른 달로 이동해도 목록이 원래 날짜로 필터링된 채 남음 — 월 이동은 항상 날짜 필터 초기화. (1차 P2) year/month/date/page 쿼리 파라미터를 검증 없이 DB 쿼리에 바로 넘겨 잘못된 값(?year=x, ?month=13)이 500이나 조용한 오작동으로 이어질 수 있었음 — 형식·범위 검증 추가. (2차 P2) listCeremoniesForDate/listCeremoniesPaginated/listCeremonyDatesForMonth가 hallRepo.findAllActive()를 써서, 홀을 비활성화하는 순간(연결 데이터는 보존되는 정책) 그 홀의 모든 과거 예식이 이 스토리가 새로 만든 조회 화면들에서 사라짐 — 이 스토리의 핵심 가치(과거 예식 조회)를 무력화하는 결함, hallRepo.findAll() 신규 추가로 수정(예식 등록 폼의 홀 드롭다운은 active-only 유지). (2차 P2) year/month와 date가 서로 다른 달을 가리키는 URL에서 캘린더와 필터링된 목록의 달이 어긋남 — 유효한 date가 있으면 그 연/월을 신뢰하도록 수정. (3차 P2) 페이지네이션 링크가 year/month를 안 실어 캘린더를 다른 달로 옮긴 뒤 페이지를 넘기면 캘린더가 이번 달로 되돌아감 — 페이지네이션에 year/month prop 추가. (3차 P2) 예식이 없는 날짜를 선택해도 점 마커가 켜져 헤더 문구(\"예식이 있는 날\")와 불일치 — 점 마커를 hasCeremony로만 켜지도록 수정. vitest 신규 12건(리포지토리 3건, 서비스 9건 — KST/UTC 경계, 페이지 clamp, 비활성 홀 포함 케이스), 최종 전체 81건 통과. 구현 중 공유 로컬 Postgres가 이미 Story 5.5(다른 워크트리) 스키마로 마이그레이션돼 있어 이 워크트리 전용 격리 DB 컨테이너(포트 5435)로 분리해 검증(다른 세션에 영향 없음). 로컬 서버 curl+로그인 쿠키로 캘린더/필터/페이지네이션/내비 활성 탭/회귀 없음 수동 검증."
    last_updated: "07-27-2026 13:40"

