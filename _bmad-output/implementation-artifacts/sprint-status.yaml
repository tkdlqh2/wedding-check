    pr_url: "https://github.com/tkdlqh2/wedding-check/pull/14"
    merge_commit: "d664a39"
    notes: "일반 merge(fast-forward), 브랜치 삭제 완료. Story 5.1 리뷰 중 대표가 발견한 후속 요구사항(Epic 5의 5번째 스토리, FR-15) — 체크리스트 템플릿을 \"단계\"(이름만)와 그 아래 여러 \"체크리스트 항목\"(제목 필수, 설명·영상 선택)의 2단계 구조로 전환. 스키마 4개 마이그레이션(0010~0013): checklist_template_items에서 description 제거, 신규 checklist_template_item_checks 테이블, demo_videos/checklist_instance_items 연결 대상 변경. ceremonyRepo.create() CTE를 단계→체크리스트 항목 전개(row_number 평탄화)로 재작성, 빈 단계는 자동 제외. 관리자 수동 추가/제외(Story 2.2)는 체크리스트 항목 단위로 전환. 오퍼레이터 조회 화면은 단계를 그룹 헤더로, 체크리스트 항목을 POS Tile로 표시. 시드 스크립트를 12단계×24개 체크리스트 항목으로 재작성. 구현 중 대표 피드백으로 범위 확장 — 어드민 템플릿/홀 화면을 prototype/(Claude Design 목업) 시각 언어에 맞춰 재스타일링, 체크리스트 항목 수정 모드에 영상 업로드 이동. 코덱스 리뷰 7라운드(1~6차 전부 실결함 발견 후 수정, 7차는 이 파일럿 단계에 적용되지 않는 프로덕션 데이터 보존 지적이라 기존 문서화로 갈음, 실질적으로 클린) — 이 저장소에서 가장 많은 리뷰 라운드를 거친 스토리. 코덱스 발견 요약: (1차 P1) 수동 추가 항목이 체크리스트 항목의 단계-내 sortOrder를 그대로 써서 여러 단계 순서 충돌. (1차 P2) stepName 중복 가능성으로 React key 충돌. (2차 P2) 시드 재실행 시 sortOrder 절대값이 끝없이 증가(수렴 안 함) — 시드 대상 이름 집합을 기준값 계산에서 제외해 해결. (3차 P2) 인스턴스 항목 그룹핑이 stepName 텍스트 기반이라 동명 단계가 하나로 합쳐짐 — template_item_id 소프트 참조 컬럼 추가. (4차 P1) 60초 폴링 API 필드명(templateItemId)과 클라이언트 타입(stepId) 불일치로 첫 폴링부터 그룹핑 깨짐 — 필드명 통일. (4차 P2) 동시 addItem 시 sortOrder 충돌 가능 — UNIQUE 제약 추가. (4차 P2) 시드 재정렬 후 재실행 시 충돌 가능 — 2단계(임시 음수값→최종값) 재배치로 해결. (5차 P2) 수동 추가 항목이 무조건 인스턴스 맨 뒤에 붙어 같은 단계가 두 그룹으로 쪼개짐 — 같은 단계 마지막 항목 바로 뒤에 삽입하는 CTE로 재작성, 그 과정에서 PostgreSQL이 참조되지 않는 데이터 변경 CTE는 실행하지 않는다는 사실을 직접 재현해 발견(강제 참조로 해결). (6차 P1) 새 UNIQUE 제약이 DEFERRABLE이 아니어서 3개 이상 행이 한 문장에서 밀릴 때 일시적 충돌 — DEFERRABLE INITIALLY DEFERRED로 수정, 2행 스왑만으로는 안 드러나는 버그라 3행 이상 시나리오를 psql로 직접 재현 후 회귀 테스트로 고정. vitest 신규 24건(체크리스트 항목 repo/service, ceremony 확장, checklist-instance 확장), 최종 전체 86건(main 병합 후 Story 5.2와 합쳐 104건) 통과. main과의 병합 충돌(sprint-status.yaml git_pipeline 섹션, Story 5.2와 동시 진행)은 두 항목 모두 보존하는 방식으로 해결, ceremony.ts/ceremony.test.ts는 git이 깨끗하게 자동 병합."
    last_updated: "07-27-2026 14:15"

