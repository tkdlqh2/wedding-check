    last_updated: "07-27-2026 00:52"

  2-1-ceremony-registration:
    stage: merged
    branch: story/2-1-ceremony-registration
    pr_url: "https://github.com/tkdlqh2/wedding-check/pull/8"
    merge_commit: "c24ca20"
    notes: "일반 merge(fast-forward), 브랜치 삭제 완료. 코덱스 리뷰 1라운드(클린). FR-4 예식 등록 + 체크리스트 인스턴스 자동 생성. ceremonies/checklist_instances/checklist_instance_items 스키마 확정(AD-2 hall_id 직접 저장, adversarial review로 확정된 최종 룰) — instance_items는 PRD \"실행용 사본\" 원칙에 따라 stepName/description/sortOrder를 생성 시점 스냅샷으로 저장하고 templateItemId는 onDelete set null 소프트 참조로만 남김(Story 1.4 FK 삭제 차단 버그 재발 방지). db.transaction() 금지 원칙에 따라 ceremony+instance+instance_items를 단일 CTE INSERT로 원자적 생성. AD-9 부분집합 매칭(계약 형태 필터링)은 Story 2.2 범위로 명시적으로 분리. 구현 중 vitest 통합 테스트로 실제 버그 발견: ceremonyRepo.create의 raw SQL에 JS Date 객체를 직접 바인딩하면 node-postgres가 세션 타임존(KST)을 거쳐 값을 변환해 9시간이 밀려 저장됨 — toISOString() 기반 UTC 리터럴 문자열 + ::timestamp 캐스팅으로 수정, 로컬 서버 실제 HTTP 요청 + DB 직접 조회로 AC 1~4 전부 검증."
    last_updated: "07-26-2026 22:17"

  chore-vitest-test-infra:
    stage: merged
    branch: chore/vitest-test-infra
    pr_url: "https://github.com/tkdlqh2/wedding-check/pull/7"
    merge_commit: "1091135"
    notes: "일반 merge(fast-forward), 브랜치 삭제 완료. 코덱스 리뷰 2라운드(1차 P1/P2 발견 후 2차 클린). Epic 1 회고 액션 아이템 3 실행: vitest + @testing-library/react 설치, node(서버/DB 통합)·jsdom(컴포넌트) 이중 environment(vitest.config.ts projects). 개발 DB와 분리된 wedding_check_test DB 신설 + drizzle-kit migrate가 로컬에서 무한 대기하는 문제를 우회하는 scripts/apply-migrations.ts(node-postgres로 drizzle/*.sql 직접 실행, docker exec/psql 불필요). 이 저장소 첫 GitHub Actions CI(.github/workflows/ci.yml, Postgres 서비스 컨테이너로 lint/tsc/test/build) 신설, main 첫 실행 그린 확인. 회귀 테스트로 Story 1.4의 실제 버그 3건을 고정: AD-2 2-hop 재검증(다른 홀 templateItemId 거부), upsertForTemplateItem 항목당 1개 교체+홀 스코프 격리, waitForVideoUpdate 폴링(코덱스 2~3차에서 잡힌 blob 웹훅 반영 타이밍 버그 — 성공 가장 금지 원칙 회귀 방지). 코덱스 발견: (1차 P1) resetDb()가 .env.test 미로딩 시 개발 DB를 통째로 TRUNCATE할 수 있음 — DB 이름이 wedding_check_test가 아니면 throw하는 가드 추가. (1차 P2) db:test:migrate가 .env.test를 자동 로드하지 않아 인자 없이 실행 시 항상 실패 — seed 스크립트와 동일하게 --env-file=.env.test 지정."
    last_updated: "07-26-2026 21:45"

