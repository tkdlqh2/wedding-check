  5-8-ceremony-screens-polish:
    stage: merged
    branch: story/5-8-ceremony-screens-polish
    pr_url: "https://github.com/tkdlqh2/wedding-check/pull/21"
    merge_commit: "89771bb"
    notes: "main(654950f) 기준 분기(primary 체크아웃). Epic 5 2차 후속 3건 중 마지막(FR-4, FR-12, FR-13, FR-18). 예식 등록 폼 날짜/시각 분리, 신랑·신부 한 줄 배치, 계약 형태 체크박스->pill 토글(제출값 동일 유지). 초기 구현 이후 대표가 실제 화면을 보고 2차 확장 요청: (1) 예식 목록 카드를 프로토타입대로 재구성 — 최상단 시간+신랑신부 이름, 그 아래 날짜/홀/계약형태, 그 아래 담당 오퍼레이터, 우측에 체크리스트 개수·상태·상세 버튼(ceremony-row.tsx 전면 재작성, isCeremonyDone을 lib/ceremony-status.ts로 추출해 react-hooks/purity 대응). (2) 예식 상세를 '포함된 항목' 나열 방식에서 템플릿 편집기와 동일한 단계(step)+체크리스트 항목 구조로 전면 재작성해 예식별로 자유롭게 단계/항목을 추가·수정할 수 있게 함 — checklist_instance_items는 템플릿과 라이브 연결이 아닌 생성 시점 스냅샷(실행용 사본)이며, 이번 스토리로 그 사본을 예식별로 커스텀 편집 가능하게 확장(AD-9 원칙 유지, 템플릿 자체는 변경 안 됨). 신규 ad_hoc_group_root_id 컬럼으로 '삭제된 템플릿 단계라 orphan인 항목'과 '새로 만든 ad-hoc 단계에 속한 항목'을 구분(groupSequentialByKey 제네릭 헬퍼, group-by-step.ts). 담당 오퍼레이터 단일 배정(ceremonies.assigned_operator_id, text FK -> user.id) — 목록은 읽기 전용 배지, 상세는 검색 가능한 모달(assignee-picker.tsx, account-menu.tsx 모달 패턴 재사용)로 배정/해제, 클릭으로 제거. 대표 지시로 '추가 가능한 항목'(제외된 템플릿 항목 복구용 섹션)은 완전 삭제 — 코덱스가 이 섹션 제거로 복구 경로가 사라진다는 점을 지적했으나(P2) 사용자의 반복된 명시적 지시라 되돌리지 않고 Change Log에 트레이드오프로 기록(내부 addInstanceItem/listCandidateChecklistItems 함수와 테스트는 향후 재노출 가능하도록 보존). 예식 상세 h1 제목을 프로토타입(WeddingDetailScreen.js)과 다르다는 대표 지적을 받아 시간+신랑신부이름(28px/700)+상태배지 제목행, 날짜·홀 메타줄로 재구성. 코덱스 리뷰 다수 라운드 — 발견 및 수정: (P1) groupItemsByStep이 adHocGroupRootId를 확인하지 않아 여러 항목짜리 ad-hoc 단계가 카드별로 쪼개짐 — 그룹 키 fallback 순서 수정(templateItemId ?? adHocGroupRootId ?? orphan:id). (P2) addAdHocItem의 CTE가 instance_id만 스코프해 hall_id 누락(AD-2 위반) — WHERE절에 hall_id 추가. (P2) ad-hoc 항목 추가 시 templateItemId가 같은 홀 소속인지만 검증하고 실제 이 예식 인스턴스에 포함됐는지(AD-9 제외 여부)는 검증 안 해 제외된 단계 우회 가능 — existsForTemplateItem 재사용해 검증 추가. (P2) 원본 템플릿 단계가 삭제된 orphan 그룹에 빠른 추가 폼을 보여주면 항상 '단계 이름을 입력해주세요' 오류로 실패 — 조건 없이 컨트롤 자체를 숨김. (P2) assignOperatorAction이 CeremonyValidationError를 조용히 삼켜, 배정 실패(예: 렌더링과 제출 사이 오퍼레이터 비활성화)에도 모달이 성공한 것처럼 닫힘 — useActionState 기반으로 전환해 실패 시 에러 표시하며 모달 유지, 성공 시에만 닫힘(queueMicrotask로 react-hooks/set-state-in-effect 대응). 병행 세션(Story 3.1)이 동일 base(654950f)에서 독립적으로 0016 마이그레이션을 만들어 충돌 — git merge origin/main으로 해결, 이 스토리의 마이그레이션을 0017/0018로 재배치(_journal.json/snapshot 수기 재구성), CI 전체 마이그레이션 체인 그린 확인. vitest 최종 213건 통과, tsc/lint/build 전부 클린. CI 그린 확인 후 gh pr merge --merge --delete-branch로 병합."
    last_updated: "07-27-2026 21:55"

