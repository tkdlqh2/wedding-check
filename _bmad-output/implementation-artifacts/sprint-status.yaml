  fix-operator-shell-and-done-lock:
    stage: merged
    branch: fix/operator-shell-and-done-lock
    pr_url: "https://github.com/tkdlqh2/wedding-check/pull/25"
    merge_commit: "a3f2484"
    notes: "fix/prototype-design-alignment(PR #24) 병합 직후 대표의 실시간 추가 피드백 연작 반영 — main(26ebacf) 기준 분기(primary 체크아웃). (1) 오퍼레이터 하단 탭(체크리스트/질의/피드백 placeholder) 제거, 어드민과 동일한 상단 헤더(로고+비밀번호 변경/로그아웃, account-menu.tsx 재사용)로 통일. (2) 오퍼레이터 홈을 prototype ScheduleScreen.js의 '담당 예식 일정'으로 재구성 — 공용 CeremonyCalendar에 basePath prop 추가해 재사용, 날짜별 예식 카드('체크리스트 열기' CTA), 기본 선택 오늘. (3) 예식 진행 상태를 시간 추정이 아닌 저장 필드(ceremonies.status, 마이그레이션 0021)로 — 최초 구현이 '예식 2시간' 시간 가정이었다가 대표 지적('상태는 오퍼레이터가 직접 변경하는 것, 맘대로 가정 넣지 마')으로 즉시 저장 필드+실행 화면 예식 시작(초록)/종료(빨강) 버튼(POST /api/operator/.../status, upcoming→ongoing→done 단방향)으로 재설계. 과거 예식은 done 백필. (4) 예정이 아닌 예식(진행중·종료)은 관리자 단 수정 전면 금지 — 최초 지시는 '종료'만이었으나 '진행중도 수정하지 말아야지' 추가 지시로 upcoming만 편집 가능으로 확정. 서비스 가드 + 상세 화면 읽기 전용(단계/항목 편집 컨트롤·담당자 지정·새 단계 폼 전부 숨김, 프로토타입 editable=status!=='done' 원칙). (5) 담당 배정 UI 재변경 — PR #24의 목록 카드 pill 토글을 되돌려, 목록은 담당자 이름만 읽기 전용, 배정/해제는 예식 상세의 검색+체크박스 대화상자(여러 명 연속 선택 가능하게 열린 채 유지, 비활성 계정 warning 태그)로. (6) 예식 상세 항목 수정 폼에 템플릿 편집기와 동일한 시연 영상 섹션 — 대표 지적('템플릿처럼 영상이 있어야 되겠니 없어야 되겠니')으로 추가했다가 코덱스 P1(영상은 공용 자산이라 업로드가 '이 예식에만 반영' 약속 위반)으로 재생 전용+템플릿 편집기 링크 안내로 확정. (7) 상태 배지 3단계(예정/진행중=warning/완료=success) 전 화면 통일. 코덱스 리뷰 5라운드, 실결함 6건 전부 수정: (1차 P2) 상태 전환 경합 패배(0행 갱신)를 성공 응답 → 재조회 후 멱등/거부 분기. (2차 P1) 인스턴스 편집 폼의 영상 업로드가 공용 템플릿 영상 변경 → 재생 전용. (2차 P2) 오퍼레이터 캘린더 월 이동 시 선택 날짜가 오늘로 되돌아가 캘린더 달과 목록 불일치 → 이동한 달의 1일 선택. (3차 P2) 클라이언트가 요청 값(next)을 확정 상태로 가정 → 서버가 저장된 상태를 재조회해 응답. (4차 P2) 상태 전환 전 시작된 폴링 GET이 낡은 상태로 되돌림 → latestRequestIdRef 무효화. (5차 P1/P2) 편집 가능 확인과 변경 쿼리 사이 TOCTOU — status='upcoming' EXISTS 가드를 모든 변경 쿼리(항목 추가/수정/삭제, 단계 이름 변경/삭제, 담당 배정 추가/해제)의 WHERE에 원자 내장, 리포지토리 직접 호출로 경합 재현하는 회귀 테스트 추가. **이 5라운드는 대표 지적('처음에 고칠 때 제대로 고치라')대로 1차 지적 시 status 필드 주변 동시성 계열 전체를 전수 점검했어야 할 사례 — 메모리(fix-defect-class-not-instance)에 기록.** 병행 세션의 Story 3.2가 0020_variable-cases를 선점해 이 브랜치의 ceremony-status를 0021로 재배치(스냅샷 체인 재구성, 세 번째 반복되는 패턴). vitest 236건(병합 후 3.2 포함 266건은 CI 확인) 통과, tsc/lint/build 클린, 상태 전환 API 실서버 검증(순방향 200/역방향 409), CI 그린 후 병합."
    last_updated: "07-28-2026 12:40"

