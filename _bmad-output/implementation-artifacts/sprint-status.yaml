    notes: "PR #25 병합 직후 대표의 후속 피드백 연작(어드민 5건+오퍼레이터 2건, 작업 중 실시간 추가 지시 2건) — main(613d354) 기준 분기(primary 체크아웃). 어드민: (1) 홀 수정 모드에서 취소·수정 저장을 입력과 같은 줄에(HallForm onCancel prop). (2) 시연 영상 업로드 UI 재설계 — 브라우저 기본 파일 입력을 시각적으로 숨기고(label 연결로 접근성 유지) '파일 선택' 버튼+선택 파일명 표시, 업로드 버튼은 btn-primary로 줄 오른쪽 끝(.video-upload__row, templates.css/ceremony-detail.css 동일 규칙). (3) /admin 기본 홈(로그인 직후 포함)을 예식 탭으로 redirect. (4) 예식 상세 '단계 추가'를 템플릿 편집기처럼 단계명 하나로 — 인스턴스 모델에는 단계 테이블이 없어(항목 행이 곧 단계 표시) 항목 없는 새 단계를 title IS NULL 자리표시 행으로 표현(마이그레이션 0022 title NOT NULL 해제, addAdHocStep/addAdHocInstanceStep). 자리표시 행은 오퍼레이터 조회·체크 집계에서 서비스 레이어가 필터(getOperatorInstanceView title!==null, OperatorInstanceItem에서 title string으로 좁힘), 이름변경/삭제/항목추가는 기존 groupRootId 경로 재사용. (5) 예식 상세 항목 수정에 영상 업로드 — 최초 구현은 '공용 demo_videos 업로드+모든 예식 반영 경고 문구'였으나 대표 실시간 지시('해당 예식에만 적용되지 모두 바꾸지 않도록')로 커밋 하나 만에 재설계: 인스턴스 항목 행에 전용 video_url(마이그레이션 0023) 저장하는 오버라이드(withVideoUrls에서 인스턴스 값이 템플릿 영상보다 우선), 전용 업로드 라우트 /api/ceremonies/[hallId]/[ceremonyId]/items/[itemId]/video/{blob,local,status}(템플릿 라우트와 동일한 AD-4 검증 구조 — onBeforeGenerateToken 인가/소유권/편집가능 검증 assertInstanceItemEditable, blob 설정 환경에서 local 경로 404 차단, upcoming 가드 내장), VideoUpload 컴포넌트에 endpointBase prop 도입해 템플릿/예식 겸용, ad-hoc 항목도 전용 영상 등록 가능해짐. (6, 실시간 추가 지시) 예식 상세 단계 그룹 ↑↓ 화살표 순서 변경 — 리포지토리 swapStepGroups가 두 인접 그룹 블록의 합집합을 블록 최솟값부터 row_number로 재번호하는 단일 UPDATE로 원자 스왑(sort_order 구멍이 있어도 안전, 사이에 낀 제3 그룹 행 감지 시 0행 거부로 낡은 순서 전제 차단, deferrable UNIQUE+재시도 래퍼), 서비스 moveInstanceStep이 현재 순서에서 인접 그룹을 계산(맨끝 이동은 조용히 무시). 오퍼레이터(프로토타입 RunScreen.js 상태 흐름): (1) 체크는 진행중(ongoing)에만 — upcoming에서는 체크 버튼 disabled+잠금 스타일(§14 기하 유지)+'예식 시작을 누르면 체크할 수 있어요' 안내. (2) 예식 종료 시 전체 완료 — doneIds가 아니라 status==='done'에서 파생(isItemDone/doneCount)해 새로고침·다른 기기에서도 유지. (3) 피드백 섹션은 done 상태에서 자동 표시(prototype showFeedback: status==='done' — 아코디언 내부 단계별 StepFeedback 토글을 제거하고 하단 섹션으로 이동, 피드백이 단계 단위 저장(Story 3.1)이라 프로토타입의 단계 선택 칩으로 대상 선택+첫 단계 자동 선택, StepFeedback autoExpand prop 신설로 마운트 즉시 기존 피드백 로드(queueMicrotask 패턴), 방금 종료 버튼을 누른 경우에만 justEndedRef로 섹션 자동 스크롤). 코덱스 리뷰 2회(1차 구현 후+추가 지시 후) 모두 P1/P2 없음 — PR #25의 교훈(결함 계열 전수 점검, fix-defect-class-not-instance)대로 상태 가드/경합 계열을 처음부터 모든 신규 변경 쿼리에 내장한 결과. 병합 직전 Story 3.3(PR #26, 질의창)이 먼저 main에 병합돼 CONFLICTING — 실행 화면 하단 섹션 순서를 프로토타입대로 체크리스트→질의(QueryPanel)→피드백으로 정리해 해소(3.3은 마이그레이션 없어 0022/0023 체인 무충돌). vitest 315건(병합 후 3.3 포함, 신규: 단계자리표시 5건+전용영상 3건+단계이동 3건+컴포넌트 잠금/전체완료/피드백 4건) 통과, tsc/lint 클린, 테스트 DB 0000~0023 전체 체인 재적용 검증, 개발 DB에 0022/0023 증분 적용. CI 그린 확인 후 gh pr merge --merge --delete-branch로 병합."
    last_updated: "07-28-2026 19:20"

  3-3-natural-language-query:
    stage: merged
    branch: story/3-3-natural-language-query
    pr_url: "https://github.com/tkdlqh2/wedding-check/pull/26"
    merge_commit: "022d4d2"
    notes: "git worktree(.claude/worktrees/story-3-3-natural-language-query)로 착수, main(d0e2a4f, Story 3.2 병합 직후) 기준 분기. Epic 3(FR-6) 3번째 스토리 — 3.2가 구축한 임베딩 인프라(variable_cases pgvector, Voyage 어댑터) 위에 질의 파이프라인을 얹음. 스키마/마이그레이션 변경 없음. 핵심 설계 결정 2건([ASSUMPTION]으로 스토리 파일 기록): (1) LLM 생성 미사용 — epics의 3.3/3.4 AC와 프로토타입 응답 카드 어디에도 생성 텍스트가 없고, 검색-원문표시만으로 NFR-1(결정성)/NFR-2(p95 5초)/SM-2(무관 사례 0%)가 구조적으로 보장됨. generateStream은 미사용으로 유지. (2) EmbeddingPort.embed에 선택적 inputType 추가(스파인 AD-1 하위호환 확장) — 문서는 'document'(3.2 경로 불변), 질의는 'query'로 임베딩하는 Voyage 공식 비대칭 검색. 구현: variable-case 검색 리포지토리(읽기 전용 신설 — 쓰기 함수 금지로 3.2의 생성 경로 단일화 결정 존중, drizzle cosineDistance + halls JOIN 표시용 hallName, AD-6 홀 필터 없음, NFR-1 tie-break distance/created_at DESC/id ASC, ANN 인덱스 없이 정확 검색), lib/services/query.ts(빈 질의/500자 검증, 상위 3건 — 3.4 AC 정합), POST /api/query(requireSessionOr401, 에러 봉투, AD-10 query_failed 구조화 로그), 질의 패널(prototype RunScreen.js 106~154행 문자 그대로 — 120px 고정폭 버튼+스피너 AC 3, pendingRef 더블클릭/Enter 재진입 차단, 매칭 카드 120ms ease-enter+reduced-motion), AD-5 오프라인 시 버튼 비활성+배너 문구. 3.4 경계(발생 홀 태그 표시, 관련 사례 없음 #2B82E0 정식 카드, 유사도 임계값, 재시도 문구)는 스토리 파일 경계 표로 명시하고 침범하지 않음 — 빈 결과는 뮤트 톤 플레인 텍스트 임시 표시. 코덱스 리뷰 4라운드(1~3차 P2 각 1건, 4차 클린): 대기 중 이전 질의 매칭 카드 노출(matches 즉시 초기화), 대기 중 입력 변경 시 도착 응답이 새 입력의 결과처럼 노출, 같은 계열로 실패 문구도 동일 — 2~3차는 처음에 submittedText 결합(질의-결과 짝 렌더링)으로 고쳤으나 사용자 지침('요청 순번 추적/응답 무효화 같은 장치 없이 in-flight 동안 입력창 disabled로 단순 차단')에 따라 입력창 잠금으로 교체 후 4차 클린. 병합 직전 병행 세션의 PR #25(오퍼레이터 셸/예식 상태 저장 필드, 마이그레이션 0021)가 먼저 main에 병합돼 PR이 CONFLICTING — origin/main 머지로 해소(sprint-status last_updated만 수기, checklist-instance-view.tsx/css는 자동 병합으로 QueryPanel과 예식 시작/종료 버튼 공존, 실서버 렌더링 확인), 격리 DB에 0021 단독 적용. 검증: 이 worktree 전용 격리 DB 컨테이너(포트 5436, pgvector) 사용(공유 5434 비접촉), vitest 최종 301건(신규 29건 — repo 6/service 8/component 13/voyage 2) 통과, tsc/lint/build 클린, 실서버(포트 3013) 로그인+HTTP 종단 검증(401/400 빈질의·500자/502 임베딩 키 없음+query_failed 로그/실행 화면 SSR 질의 패널). 실제 Voyage 임베딩의 의미 유사도는 실키 미보유로 로컬 실증 불가(3.2와 동일 한계) — 프로덕션 키 투입 후 SM-2 검수 세트로 검증 필요. CI 그린 확인 후 gh pr merge --merge --delete-branch로 병합."
