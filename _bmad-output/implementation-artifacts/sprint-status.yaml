    pr_url: "https://github.com/tkdlqh2/wedding-check/pull/10"
    merge_commit: "de95ffc"
    notes: "일반 merge(fast-forward), 브랜치 삭제 완료. 코덱스 리뷰 5라운드(1~5차 전부 실결함 발견 후 수정, 6차 클린) — 이 저장소에서 가장 많은 리뷰 라운드를 거친 스토리. AD-5(체크리스트 조회만 캐시, AI 질의는 온라인 전용) 구현: /operator(오늘 예식 목록, listTodaysCeremonies 재사용, 오퍼레이터는 특정 홀에 소속되지 않아 홀 교차 목록), /operator/ceremonies/[hallId]/[ceremonyId](Server Component 초기 로드 + Client Component가 SSR 데이터를 즉시 localStorage에 write-through 후 60초 stale-while-revalidate 폴링). 항목은 POS Tile로 렌더링, 탭 시 순수 클라이언트 로컬 상태만 즉시 토글(스키마에 완료 필드 없어 서버 저장 안 함, 스토리 Dev Notes에 근거 기록). getOperatorInstanceView는 기존 getCeremonyDetail과 일부 리포지토리 호출을 공유하지만 60초 폴링에 불필요한 listCandidateTemplateItems 쿼리를 추가하지 않기 위해 별도 함수로 분리. 코덱스 발견 5건, 전부 실결함: (1차 P2) tablet 768~1024px 레이아웃에서 .operator-content에 100dvh를 또 줘서 하단 내비가 뷰포트 밖으로 밀림 — .operator-shell을 height:100dvh로 고정하고 .operator-content는 상속된 flex:1만 쓰도록 수정. (2차 P2) 폴링의 모든 실패(네트워크 끊김 vs 401/404/500)를 같은 catch에서 오프라인으로 뭉뚱그려, 세션 만료/서버 오류에도 낡거나 접근 권한 없는 캐시를 계속 보여줌 — fetch() 자체의 throw(진짜 오프라인)만 캐시 폴백하고, res.ok=false는 401→로그인 리다이렉트/그 외→캐시를 안 건드리는 별도 오류 표시로 분리. (3차 P2) 클라이언트의 401 리다이렉트 분기가 서버가 실제로 401을 반환하지 않아(requireSession()의 throw가 500으로 새어나감) 죽은 코드였음, 폴링 라우트가 hall.isActive 검증도 건너뜀 — 둘 다 라우트에서 명시적으로 처리하도록 수정. (4차 P2) 캐시 스키마 검증이 최상위만 확인해 items:[null]이나 잘못된 ceremonyAt이 통과해 오프라인 폴백 자체가 크래시할 수 있었음 — 항목별/날짜 파싱까지 검증 강화. (5차 P2) 60초보다 느린 응답이 겹치면(이 스토리가 다루는 바로 그 불안정 와이파이 상황) 먼저 시작된 요청이 뒤늦게 도착해 최신 상태를 덮어씀 — useRef 기반 요청 순번으로 최신 요청이 아니면 결과를 버리도록 수정. 로컬 서버에 실제 로그인+HTTP 요청(200/400/401/404)과 DB 직접 조작(비활성 홀, 인스턴스 항목 추가)으로 서버/데이터 경로 검증; 이 세션에 브라우저 조작 도구가 없어 실제 오프라인 토글과 태블릿 리사이즈는 컴포넌트 테스트 모킹 + CSS 코드 리뷰로 대체 검증(스토리 파일에 한계 명시). vitest 신규 15건, 최종 전체 61건 통과. epic-2(예식 등록과 체크리스트 인스턴스 자동 조합) 전체 스토리 완료로 epic 상태도 done 전환."
