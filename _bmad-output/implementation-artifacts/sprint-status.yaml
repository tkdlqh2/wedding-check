# STATUS DEFINITIONS:
# ==================
# Epic Status:
#   - backlog: Epic not yet started
#   - in-progress: Epic actively being worked on
#   - done: All stories in epic completed
#
# Story Status:
#   - backlog: Story only exists in epic file
#   - ready-for-dev: Story file created, ready for development
#   - in-progress: Developer actively working on implementation
#   - review: Implementation complete, ready for review
#   - done: Story completed
#
# Retrospective Status:
#   - optional: Can be completed but not required
#   - done: Retrospective has been completed
#
# Action Item Status:
#   - open: Committed during a retrospective, not yet addressed
#   - in-progress: Actively being worked on
#   - done: Completed
#
# GIT PIPELINE STAGE (git_pipeline section, project-specific extension):
# ========================================================================
# branch-created  -> story branch cut from main
# committing      -> implementation commits being added on the branch
# pushed          -> branch pushed to origin
# pr-open         -> PR opened against main
# codex-review    -> codex review running/ran on the PR
# changes-requested -> codex review found blocking issues, fixing on branch
# merged          -> PR merged into main, branch pipeline complete
#
# WORKFLOW NOTES:
# ===============
# - Mark epic as 'in-progress' when starting work on its first story
# - Developer typically creates next story ONLY after previous one is 'done' to incorporate learnings
# - Dev moves story to 'review', then Dev runs code-review (fresh context, ideally different LLM)
# - Per-story git flow (user preference, 2026-07-26): story branch -> step-by-step commits ->
#   codex review -> PR -> auto-merge to main if review is clean. git_pipeline tracks the substage.
# - Retrospective appends its action items to action_items; sprint-status surfaces open ones

