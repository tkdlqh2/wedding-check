    pr_url: "https://github.com/tkdlqh2/wedding-check/pull/23"
    merge_commit: "cbaee89"
    notes: "git worktree(.claude/worktrees/story-3-2-feedback-structuring-confirmation)로 착수, main(4108d43, Story 3.1 병합 직후) 기준 분기. Epic 3(FR-9, AD-8) 2번째 스토리 — 이 프로젝트 최초로 실제 AI(LLM+임베딩) 벤더를 연동. LLMPort/EmbeddingPort를 스파인 AD-1 확정 시그니처로 승격하고 Anthropic(claude-haiku-4-5 structured outputs)/Voyage(voyage-3.5, 1024차원) 어댑터 실장(lib/ai/index.ts 조립 지점 신설). feedback 테이블에 situation/outcome/rationale/tags 4필드 추가 + 확정된 피드백에서만 생성되는 variable_cases(pgvector) 테이블 신설(이 프로젝트 최초 pgvector 컬럼). 설계 편차 2건: (1) variable_case 생성 경로를 feedbackRepo.confirmAndCreateVariableCase() 단일 함수로 통일(원자적 CTE와 비원자적 단독 insert 두 경로 공존 위험 제거), (2) db.transaction()이 neon-http에서 throw하는 기존 확정 제약(Story 1.3/2.1)과 충돌해 ceremonyRepo.create()와 동일한 단일 CTE(UPDATE+INSERT 체이닝)로 원자성 확보. 코덱스 리뷰 4라운드(1~4차 전부 실결함 발견 후 수정, 총 18건) — 핵심 2건: AC 1의 '5필드 모두 채워짐'에서 tags가 빠져 빈 배열로도 확정 가능했던 결함(4개 지점 모두 normalizeTags로 통일), 구조화 이후 원본 content 재저장 시 situation/outcome/rationale/tags가 무효화되지 않아 내용과 어긋난 결과가 확정될 수 있던 결함(AD-8 위반 소지, upsertDraft의 onConflictDoUpdate에 CASE WHEN 추가로 content 실제 변경 시에만 초기화). 그 외 fieldsDirty 미반영 재구조화 덮어쓰기, 확정 버튼 더블클릭 경합, Voyage 응답 shape/차원/index 검증 누락, 로그 누락, requireSessionOr401 3파일 중복, outcome/tags 완결성 체크 비대칭 등. PR 머지 준비 중 Story 5.8(PR #21)+후속 fix/prototype-design-alignment(PR #24)가 먼저 병합돼 마이그레이션 0017~0019를 선점(3.1 완료 노트가 예고한 충돌) — 0017→0020으로 재배치, 0019_snapshot.json 기반 재구성, drizzle-kit check로 정합성 재확인. 5.8의 오퍼레이터 화면 RunScreen.js 전면 재작성과 checklist-instance-view.css 충돌은 클래스명이 겹치지 않아 텍스트 충돌만 해결. vitest 최종 264건(5.8 신규 포함) 통과, tsc/lint/build 클린, CI 그린, 실서버+실DB로 AD-8 원자성(임베딩 실패 시 draft 유지·variable_cases 미생성) 및 tags 완결성·content 재저장 무효화 실증."
    last_updated: "07-28-2026 00:15"

  fix-prototype-design-alignment:
    stage: merged
    branch: fix/prototype-design-alignment
    pr_url: "https://github.com/tkdlqh2/wedding-check/pull/24"
    merge_commit: "83aa993"
    notes: "Story 5.8 병합 직후 대표의 전면 디자인 지적('프로토타입이랑 홀 템플릿 양식에 맞게 제발 정리해줘') 반영 — 5개 화면 일괄 정합화 + 데이터 모델 변경 1건. (1) 담당 오퍼레이터 다중 배정: Story 5.8의 단일 컬럼(assigned_operator_id)을 ceremony_assignees 조인 테이블(마이그레이션 0019, PK=ceremony_id+operator_id, hall_id 직접 저장 AD-2)로 대체하고 기존 배정 데이터 이관 후 컬럼 제거 — 프로토타입 WeddingScreen.js의 assignees 배열 모델 그대로, 예식 목록 카드에서 활성 오퍼레이터 전원을 pill 토글로 배정/해제(toggleAssignee: 배정 추가만 자격 검증, 해제는 stale 담당자도 항상 허용). 상세 화면의 검색 모달(assignee-picker.tsx)은 삭제하고 담당은 메타 줄 읽기 전용으로 — 프로토타입이 배정 조작을 목록 카드에만 두는 구조라 그대로 따름. (2) 홀 추가 폼: 이름 입력+등록 버튼 한 줄. (3) 새 예식 등록 폼: WeddingScreen.js 44~75행 그대로 — 12px/700 muted 필드 라벨, 홀 셀렉트→pill 토글, '담당 오퍼레이터는 등록 후 예식 카드에서 배정' 안내 박스, 전체 폭 CTA. (4) 예식 상세: 템플릿 편집기와 동일 구조로 — 단계 헤더에 수정(인라인 이름 변경)/단계 삭제 추가(renameInstanceStep/deleteInstanceStep 신설, 그룹 키는 templateItemId→adHocGroupRootId→itemId 3단 위계, 스냅샷만 수정하고 템플릿 무관), 항목 행에 '긴 설명' 태그+수정/삭제(제외→삭제로 라벨 통일), warning 톤 '이 예식 전용' 안내 박스(승인 토큰 color-mix 파생, 임의 hex 금지 준수). (5) 오퍼레이터 실행 화면 전면 재작성(RunScreen.js 이식): 예식 헤더 카드(날짜·홀/시간+신랑신부 제목/계약 칩+상태 배지/체크 진행 N-M 28px), 단계 아코디언(번호 배지, 단계별 진행 카운트, 완료 시 초록), 항목별 원형 체크 버튼(로컬 상태, 즉각 반영), '상세' 펼침에 설명 전문+시연 영상 재생(getOperatorInstanceView가 templateItemCheckId로 demo_videos 병합 — 기존엔 오퍼레이터가 영상을 볼 수단이 없었음), 오프라인 배너 warning 톤 전환, 60초 폴링/캐시 로직은 유지하되 캐시 셰이프 확장(구버전 캐시는 검증 탈락으로 자연 무효화). 오퍼레이터 홈 카드도 시간+신랑신부 위계로 정렬. drizzle-kit generate 비TTY 이슈로 0019 snapshot 수기 구성(기존 선례), 격리 테스트 DB에 0000~0019 전체 체인 적용 검증 + 개발 DB에도 0019 직접 적용(기존 배정 1건 이관 확인). vitest 228건(신규/재작성: 다중 배정 repo 5건+service 7건, 단계 수정/삭제 7건, 실행 화면 컴포넌트 13건, 캐시 셰이프) 통과, tsc/lint/build 클린, 로컬 서버 실제 로그인(관리자/오퍼레이터 각각)으로 5개 화면 렌더링 curl 검증. 코덱스 리뷰 1라운드 클린. CI 그린 확인 후 병합."
    last_updated: "07-27-2026 23:35"
