    notes: "일반 merge(fast-forward), 브랜치 삭제 완료. 코덱스 리뷰 1라운드(클린). Epic 5(어드민 UX 보완) 신설 — 2026-07-27 대표의 실제 어드민 화면 점검 후속 4건 중 1번째. 어드민 내비게이션 \"템플릿\" placeholder span과 없던 \"홀\" 항목을 /admin/halls로 가는 실제 Link로 교체(홀/템플릿 관리 페이지 자체는 Story 1.2/1.3에서 이미 정상 구현돼 있었으나 내비 배선만 누락). SSR HTML 직접 확인(curl+로그인 쿠키)으로 검증. 머지 직후 대표가 화면을 다시 보고 \"홀\"과 \"템플릿\"이 같은 목적지라 중복이라는 피드백을 줘 \"템플릿\" 탭을 제거하고 \"홀\"만 남기는 후속 수정 진행(별도 커밋, 이 스토리 종료 후)."
