    notes: "git worktree(.claude/worktrees/story-3-4-evidence-based-response)로 착수, main(c4a1309) 기준 분기. Epic 3 마지막 스토리(FR-7) — 3.3이 만든 질의 파이프라인 위에 안전장치 3종을 얹음. 스키마 변경·마이그레이션 없음. (1) 유사도 임계값 필터: pgvector 검색은 코퍼스에 행이 있으면 항상 상위 N건을 반환하므로 임계값 없이는 AC 3('관련 있는 케이스가 하나도 없을 때')을 판정할 수 없고 SM-2(무관 사례 0%)가 구조적으로 불가능 — 필터는 서비스에 두고(정책은 서비스, SQL 아님) LIMIT 3 이후 적용(정렬이 distance 단조라 filter(top3)===top3(filter), 리포지토리 무수정). queryVariableCases 반환을 { matches, topSimilarity }로 확장하고 topSimilarity는 관측성 전용으로 응답 바디 미노출. (2) 발생 홀 메타 태그(프로토타입 RunScreen.js 130행 {m.meta} 자리, 'M월 D일 · 홀 · 단계', createdAt 파싱 불가 시 날짜만 생략해 Invalid Date 노출 차단) + #2B82E0 '관련 사례 없음' 정식 카드(143~152행 문자 그대로, 배경은 #eef5fd를 color-mix로 토큰 파생 — 임의 hex 금지). (3) 실패 4종 분리(연결 끊김/세션 만료/검증 실패/서버 오류) — 세션 만료만 액션이 /login 링크이고 패널은 자동 리다이렉트하지 않음(예식 중 화면 강제 이동 위험, 폴링 쪽에 이미 존재). '다시 시도'는 새 제출 경로를 만들지 않고 기존 runQuery()를 호출해 3.3의 pendingRef 이중 제출 가드를 상속. 입력 변경 시 오류 카드만 비우고 매칭/없음 카드는 유지(오류 카드에만 액션이 있어 대상이 모호해지므로 — 의도된 비대칭, 주석·테스트에 명시). **임계값은 가정이 아니라 실측으로 확정**: 구현 중 사용자가 실 OPENAI_API_KEY를 제공해 실제 text-embedding-3-large(1024차원)로 측정(문서 3건×질의 8건) — 관련 0.500~0.674 / 무관 0.183~0.366으로 두 구간이 비어 있어 그 사이 0.42 채택(무관 최댓값 +0.054, 관련 최솟값 -0.08). 착수 시 문헌 기준선만 보고 잡은 0.5는 진짜 매칭이 0.5007/0.5023으로 0.0005 차이로 통과하는 취약한 값이라 폐기. 환경변수 미사용(설정 한 줄로 안전 게이트가 꺼지는 경로 차단 + NFR-1 결정성). **실측으로 드러난 한계(대표 판단 필요)**: PRD가 NFR-4 예시로 명시한 '주례자가 순서를 바꿈' ≒ '목사님이 애드리브함'은 실측 0.277로 무관 질의(주차 0.366)보다 낮아 어떤 임계값에서도 SM-2와 동시 만족 불가 — 단계명·태그를 임베딩에 덧붙여도 0.285로 구제 안 됨. SM-2를 우선해 0.42를 택하고 하이브리드 검색/동의어 확장은 deferred-work.md에 기록. 관측성: 무매칭 시 query_no_match 구조화 로그(topSimilarity 포함, 질의 텍스트는 NFR-5로 제외) — 실데이터 재보정의 유일한 계측 근거. 코덱스 리뷰 3라운드: 1차 P2(성공 응답 셰이프 미검증 — 2xx 비정상 JSON이 네트워크 오류로 오분류되거나 matches.length 렌더링에서 크래시해 오류 카드조차 안 뜸)를 지적 한 줄이 아닌 계열 전체로 수정(checklist-cache.ts가 Story 2.3 코덱스 4차 P2에서 확립한 '최상위만이 아니라 배열 원소 하나하나' 검증 방식 이식, 테스트 6건), 2차 P2(0.4~0.9 단순 범위 테스트가 무관 사례를 통과시키는 값으로 바뀌어도 성공 — SM-2 미검증)를 실측 구간(무관 0.366 초과 / 관련 0.500 미만) 고정 테스트로 교체, 3차 클린. 검증: worktree 전용 격리 DB(포트 5437, pgvector, 0000~0023 전체 